name: TUI plugin CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Host build and typecheck
        run: pnpm run build:lib:host
      - name: Client build and typecheck
        run: pnpm run build:lib:client
      - name: TUI and launcher tests
        run: pnpm test
      - name: Repository closure and bilingual docs
        run: |
          pnpm run verify:repo
          pnpm run test:docs
          pnpm run typecheck
