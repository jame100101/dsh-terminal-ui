name: TUI plugin CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Host build and typecheck
        run: pnpm run build:lib:host
      - name: Client build and typecheck
        run: pnpm run build:lib:client
      - name: TUI and launcher tests
        run: pnpm exec vitest run packages/tui apps/tui-cli/tests --exclude packages/tui/tui/tests/ink-output-arbiter.spec.ts
      - name: Interactive Ink terminal fixtures
        # Ink suppresses incremental terminal output in CI mode; this suite owns fake TTY streams.
        env:
          CI: 'false'
        run: pnpm exec vitest run packages/tui/tui/tests/ink-output-arbiter.spec.ts
