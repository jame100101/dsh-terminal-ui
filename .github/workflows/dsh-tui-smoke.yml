# Keyless cross-platform verification of the out-of-tree npm plugin. The job
# builds only the TUI host face, runs the focused packaging and launcher tests,
# packs the staged plugin, and verifies it against a fresh official dsh install.
# It never calls the DeepSeek API.
name: dsh-tui cross-platform smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI runs must never report to the production telemetry endpoint baked
  # into official dsh (disabled for this keyless verifier).
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  smoke:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['24', '22.19']
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Build TUI host dependencies
        run: pnpm run build:lib:host

      - name: Focused launcher and packaging tests
        run: pnpm exec vitest run apps/tui-cli/tests/assemble-plugin.spec.ts apps/tui-cli/tests/translate.spec.ts apps/tui-cli/tests/legacy-migration.spec.ts

      - name: Assemble the plugin
        run: pnpm --filter @jame100101/dsh-tui run assemble-plugin

      - name: Pack the staged plugin
        shell: bash
        run: |
          npm pack ./apps/tui-cli/plugin-dist --pack-destination "$RUNNER_TEMP"

      - name: Verify official clean room
        shell: bash
        run: |
          TGZ="$(find "$RUNNER_TEMP" -maxdepth 1 -name '*.tgz' -print -quit)"
          test -n "$TGZ" || { echo "::error::no tarball found in $RUNNER_TEMP"; exit 1; }
          node scripts/audit-tarball.mjs "$TGZ"
          node apps/tui-cli/scripts/verify-official-plugin.mjs "$TGZ"
