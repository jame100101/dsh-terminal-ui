# Keyless cross-platform verification of the real npm install experience for
# @jame100101/dsh-tui: builds the bundled runtime from source, packs the npm
# tarball, installs it globally, and exercises the CLI (version, help, usage
# errors). It never calls the DeepSeek API — real-model validation lives in
# e2e.yml. Runs manually before a release and automatically on pull requests
# that touch product-affecting paths.
name: dsh-tui cross-platform smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/dsh-tui-smoke.yml'
      - 'apps/**'
      - 'packages/tui/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'scripts/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI runs must never report to the production telemetry endpoint baked
  # into apps/cli/cordis.yml (AppCLIEntry disables the row when set).
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  smoke:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['24', '22.19']
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      # The assemble step needs both build faces: some workspace packages
      # only emit their Node entry in the client build.
      - name: Build host + client lib
        run: pnpm run build:lib

      - name: Assemble the dsh-tui bundled runtime
        run: pnpm run dsh-tui:assemble-runtime

      - name: Pack the npm tarball
        shell: bash
        run: |
          cd apps/tui-cli
          npm pack --pack-destination "$RUNNER_TEMP"

      - name: Install the tarball globally
        shell: bash
        run: |
          TGZ="$(find "$RUNNER_TEMP" -maxdepth 1 -name '*.tgz' -print -quit)"
          test -n "$TGZ" || { echo "::error::no tarball found in $RUNNER_TEMP"; exit 1; }
          npm install -g "$TGZ"

      # Keyless CLI smoke: version and help exit 0, an unknown option is a
      # usage mistake and must exit 2. None of these touch the API.
      - name: CLI smoke (no API)
        shell: bash
        run: |
          set -euo pipefail
          dsh-tui --version
          dsh-tui --help >/dev/null
          set +e
          dsh-tui --definitely-unknown-option >/dev/null 2>&1
          code=$?
          set -e
          if [ "$code" -ne 2 ]; then
            echo "::error::unknown option must exit 2, got $code"
            exit 1
          fi
          echo "usage-error exit code 2 confirmed"
