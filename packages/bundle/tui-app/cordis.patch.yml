# The dsh-tui-app bundle patch: the terminal surface over dsh-base.
# Like headless, it mounts no HTTP server, Web runtime, or browser plugin.
# Like web-app, it keeps shared providers and registries on the host plane and
# disables base model-facing rows; every TUI session obtains those rows from
# its resolved agent preset.

- id: system-prompt
  config:
    persona: >-
      You are a coding agent powered by the {{model}} model. Your working directory is {{cwd}}.

# The shared module-reload HMR row stays off; the launcher's watch-only
# fallback still keeps the user patch layers live until the run exits.
- id: hmr
  disabled: true

# ── the terminal surface ────────────────────────────────────────────────

- insert:
    - id: tui
      name: '@deepseek-ai/dsh-tui'
      config:
        profilePatchPath: !!js dshHomePath('profiles', 'tui', 'cordis.patch.yml')
        # These rows move behind agent presets below. Enabling one on the host
        # would bypass per-session composition rather than toggle an extension.
        pluginToggleProtectedIds:
          - tool-bash
          - tool-pwsh
          - tool-jobs
          - tool-fs
          - tool-fs-search
          - tool-str-replace-editor
          - skill-filesystem
          - tool-skill
          - tool-goal
          - plan-mode
          - compaction-basic
          - command-compact
          - tool-result-pruner
          - tool-subagent-control
          - tool-subagent-list-agents
          - tool-subagent
          - tool-subagent-fork
          - workflow-worker-thread
          - tool-workflow
          - tool-ralph
          - agent-instructions
          - tool-todo
          - tool-web

    # Code Mode is a core execution capability, not a Web component (the
    # headless and web-app bundles mount the same row). The `code` agent
    # preset's tool-presentation row waits on this host-plane runtime; without
    # it the preset cannot mount, and switching to it fails with
    # "preset failed to mount" naming tool-presentation.
    - id: code-runtime
      name: '@deepseek-ai/dsh-code-runtime-worker-thread'

    # The host half of the self-modification toolset (cordisInspect +
    # dynamicCordisRunner). The `cordis` agent preset's tool-cordis row waits
    # on these two services; without them that preset cannot mount. The CLIENT
    # half stays Web-only (it injects the Web runtime's modules/slots/remote),
    # so the tui composition mounts only this host row — mirroring web-app.
    - id: cordis-host-runner
      name: '@deepseek-ai/dsh-cordis-host-runner'

    # Durable per-message feedback sidecar (Web parity for 👍/👎): the base
    # bundle already loads session-persistence; storage + storage-domain host
    # the sidecar domain (the web-app rows, mirrored).
    - id: storage
      name: '@deepseek-ai/dsh-storage'

    - id: storage-json
      name: '@deepseek-ai/dsh-storage-json'
      config:
        root: !!js dshHomePath('storages')

    - id: storage-domain
      name: '@deepseek-ai/dsh-storage-domain'
      config:
        backend: json

    - id: message-feedback
      name: '@deepseek-ai/dsh-message-feedback'
      config:
        maxNoteBytes: 8192

    # Canonical `@session` mentions are resolved at the official pre-step
    # extension point into durable, bounded, read-only session context. The
    # TUI only supplies discovery and mention insertion.
    - id: session-reference
      name: '@deepseek-ai/dsh-session-reference'

# ── the agent plane moves behind agent presets ─────────────────────────────
# Keep this preset-owned list aligned with web-app. Shared registries,
# providers, persistence, policy, token metering, and TUI runtimes stay on the
# host plane; these rows contribute model-facing tools, prompt sections,
# commands, or per-agent implementations and therefore come from one preset.

- id: tool-bash
  disabled: true

- id: tool-pwsh
  disabled: true

- id: tool-jobs
  disabled: true

- id: tool-fs
  disabled: true

- id: tool-fs-search
  disabled: true

- id: tool-str-replace-editor
  disabled: true

- id: skill-filesystem
  disabled: true

- id: tool-skill
  disabled: true

- id: tool-goal
  disabled: true

- id: plan-mode
  disabled: true

- id: compaction-basic
  disabled: true

- id: command-compact
  disabled: true

- id: tool-result-pruner
  disabled: true

- id: tool-subagent-control
  disabled: true

- id: tool-subagent-list-agents
  disabled: true

- id: tool-subagent
  disabled: true

- id: tool-subagent-fork
  disabled: true

- id: workflow-worker-thread
  disabled: true

- id: tool-workflow
  disabled: true

- id: tool-ralph
  disabled: true

- id: agent-instructions
  disabled: true

- id: tool-todo
  disabled: true

- id: tool-web
  disabled: true

- insert:
    # The preset roster: the four shipped presets under `config/agent-presets/`
    # (code/cordis/minimal/standard) plus the writable `$DSH_HOME/.agent-presets`
    # user root (dsh-agent-presets' own default). The SHIPPED system root is an
    # assembly fact — `apps/cli`'s composeProfile resolves it beside this app's
    # own config and patches it in as an overlay, exactly like the web-app
    # bundle. New sessions resolve this roster's current default unless they
    # continue an explicit preset; resume rebuilds the newest logged selection.
    - id: agent-presets
      name: '@deepseek-ai/dsh-agent-presets'
      config:
        default: standard
