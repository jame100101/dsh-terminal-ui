# The dsh-tui-app bundle patch: the terminal surface over dsh-base.
# Like headless, it mounts no HTTP server, Web runtime, or browser plugin.
# Like web-app, it keeps shared providers and registries on the host plane and
# disables base model-facing rows; every TUI session obtains those rows from
# its resolved agent preset.

- id: system-prompt
  config:
    persona: >-
      You are a coding agent powered by the {{model}} model. Your working directory is {{cwd}}.

# The shared module-reload HMR row stays off; the launcher's watch-only
# fallback still keeps the user patch layers live until the run exits.
- id: hmr
  disabled: true

# ── the terminal surface ────────────────────────────────────────────────

- insert:
    - id: tui
      name: '@deepseek-ai/dsh-tui'
      config:
        profilePatchPath: !!js dshHomePath('profiles', 'tui', 'cordis.patch.yml')
        # These rows move behind agent presets below. Enabling one on the host
        # would bypass per-session composition rather than toggle an extension.
        pluginToggleProtectedIds:
          - tool-bash
          - tool-pwsh
          - tool-jobs
          - tool-fs
          - tool-fs-search
          - tool-str-replace-editor
          - skill-filesystem
          - tool-skill
          - command-goal
          - tool-goal
          - plan-mode
          - compaction-basic
          - command-compact
          - tool-result-pruner
          - tool-subagent-control
          - tool-subagent-list-agents
          - tool-subagent
          - tool-subagent-fork
          - workflow-worker-thread
          - tool-workflow
          - tool-ralph
          - agent-instructions
          - tool-todo
          - tool-web

    # PTC (`run_code`) waits on this host-plane TypeScript runtime. Without it
    # the `ptc` preset cannot mount, and switching to it fails with
    # "preset failed to mount" naming tool-presentation. Headless and web-app
    # mount the same row.
    - id: code-runtime
      name: '@deepseek-ai/dsh-code-runtime-worker-thread'

    # The host half of the self-modification toolset (cordisInspect +
    # dynamicCordisRunner). The `cordis` agent preset's tool-cordis row waits
    # on these two services; without them that preset cannot mount. The CLIENT
    # half stays Web-only (it injects the Web runtime's modules/slots/remote),
    # so the tui composition mounts only this host row — mirroring web-app.
    - id: cordis-host-runner
      name: '@deepseek-ai/dsh-cordis-host-runner'

    # Host-owned opt-in sampled when a new session receives its preset
    # delegation tools. Standard/cordis presets mount tool-subagent which
    # requires this Host-scope settings plugin.
    - id: subagent-model-selection-settings
      name: '@deepseek-ai/dsh-tool-subagent/model-selection-settings'

    # Durable per-message feedback sidecar (Web parity for 👍/👎). Storage
    # domains now live on dsh-base; this surface only mounts the sidecar.
    - id: message-feedback
      name: '@deepseek-ai/dsh-message-feedback'
      config:
        maxNoteBytes: 8192

    # Canonical `@session` mentions are resolved at the official pre-step
    # extension point into durable, bounded, read-only session context. The
    # TUI only supplies discovery and mention insertion.
    - id: session-reference
      name: '@deepseek-ai/dsh-session-reference'

# ── the agent plane moves behind agent presets ─────────────────────────────
# Keep this preset-owned list aligned with web-app. Shared registries,
# providers, persistence, policy, token metering, and TUI runtimes stay on the
# host plane; these rows contribute model-facing tools, prompt sections,
# commands, or per-agent implementations and therefore come from one preset.

- id: tool-bash
  disabled: true

- id: tool-pwsh
  disabled: true

- id: tool-jobs
  disabled: true

- id: tool-fs
  disabled: true

- id: tool-fs-search
  disabled: true

- id: tool-str-replace-editor
  disabled: true

- id: skill-filesystem
  disabled: true

- id: tool-skill
  disabled: true

- id: command-goal
  disabled: true

- id: tool-goal
  disabled: true

- id: plan-mode
  disabled: true

- id: compaction-basic
  disabled: true

- id: command-compact
  disabled: true

- id: tool-result-pruner
  disabled: true

- id: tool-subagent-control
  disabled: true

- id: tool-subagent-list-agents
  disabled: true

- id: tool-subagent
  disabled: true

- id: tool-subagent-fork
  disabled: true

- id: workflow-worker-thread
  disabled: true

- id: tool-workflow
  disabled: true

- id: tool-ralph
  disabled: true

- id: agent-instructions
  disabled: true

- id: tool-todo
  disabled: true

- id: tool-web
  disabled: true

- insert:
    # The preset roster: shipped compositions live in
    # `@deepseek-ai/dsh-agent-presets/presets` (cordis/minimal/ptc/standard)
    # and `includeShippedRoot` defaults to true. The writable user root is
    # `$DSH_HOME/.agent-presets`. New sessions use this roster's current
    # default unless they continue an explicit preset; resume rebuilds the
    # newest logged selection.
    - id: agent-presets
      name: '@deepseek-ai/dsh-agent-presets'
      config:
        default: standard
